<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Some standard html stuff -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- A short and witty title does the trick -->
    <title>AR Example with Aframe and MindAR</title>
    <!-- Import Scripts for Aframe, mind-ar and Aframe extras for animation -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>

</head>

<body>
    <!-- Create a Scene and identify the image target -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.001; filterBeta: 30; missTolerance: 30;"
        color-space="sRGB" renderer="colorManagement: true"
        device-orientation-permission-ui="enabled: false" vr-mode-ui="enabled: false" id="scene">
        <!-- Load an asset - GLTF Model (the id must match the src="#..." below) -->
        <a-assets>
            <a-asset-item id="Card" response-type="arraybuffer" src="carte_ar.glb"></a-asset-item>
        </a-assets>

        <!-- Lights (the glb no longer embeds any) -->
        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" intensity="1" position="1 2 3"></a-light>

        <!-- Add a camera -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- The target image is 1 unit wide; the card is 6.09 units wide in the glb,
             so scale = 1 / 6.09 = 0.164. No rotation: the card already lies in the XY plane. -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model animation-mixer position="0 0 0" rotation="0 0 0" scale="0.164 0.164 0.164"
                src="#Card" id="Card3D"></a-gltf-model>
        </a-entity>
    </a-scene>
</body>

</html>
